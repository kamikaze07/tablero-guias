server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ \.php$ {
        set $upstream_php php:9000;
        fastcgi_pass $upstream_php;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    # mime.types de la imagen base no incluye .wav (sí .ogg) — sin esto se
    # sirve como application/octet-stream, arriesgando que algún navegador
    # se niegue a decodificarlo como audio.
    location ~* \.wav$ {
        default_type audio/wav;
    }
}
