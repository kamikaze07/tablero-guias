services:
  nginx:
    image: nginx:alpine
    container_name: atlas-nginx
    ports:
      - "${NGINX_PORT:-8097}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: atlas-php
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: mariadb:11
    container_name: atlas-db
    ports:
      - "${ATLAS_DB_EXTERNAL_PORT:-3311}:3306"
    environment:
      MARIADB_DATABASE: ${ATLAS_DB_DATABASE}
      MARIADB_USER: ${ATLAS_DB_USERNAME}
      MARIADB_PASSWORD: ${ATLAS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${ATLAS_DB_ROOT_PASSWORD}
    volumes:
      - atlas-db-data:/var/lib/mysql

  websocket:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: atlas-websocket
    command: php bin/websocket-server.php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    ports:
      - "${WEBSOCKET_PORT:-8098}:${WEBSOCKET_PORT:-8098}"
    depends_on:
      - db

  sync-engine:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: atlas-sync-engine
    command: php bin/sync-engine.php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
      - websocket

volumes:
  atlas-db-data:
