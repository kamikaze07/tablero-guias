services:
  nginx:
    image: nginx:alpine
    container_name: atlas-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8097}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: atlas-php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      # Misma carpeta OUT que atlas-monitoring (ver
      # App\Monitoring\Timbrado\StampingEvidenceSource) — aquí de solo
      # lectura para que public/api/timbrado-carta-porte.php pueda servir
      # el PDF del Complemento Carta Porte ya timbrado.
      - ${SICRET_TIMBRADO_OUT_HOST_PATH:-./storage/timbrado-out}:/timbrado-out:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - forsis-comunicaciones

  db:
    image: mariadb:11
    container_name: atlas-db
    restart: unless-stopped
    ports:
      - "${ATLAS_DB_EXTERNAL_PORT:-3311}:3306"
    environment:
      MARIADB_DATABASE: ${ATLAS_DB_DATABASE}
      MARIADB_USER: ${ATLAS_DB_USERNAME}
      MARIADB_PASSWORD: ${ATLAS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${ATLAS_DB_ROOT_PASSWORD}
    volumes:
      - atlas-db-data:/var/lib/mysql
    # Sin esto, cada reinicio del host (o de este stack) hacía que php/
    # websocket/sync-engine/monitoring/daily-cutover arrancaran antes de
    # que mariadb aceptara conexiones — 4-5 crashes en cascada
    # (PDOException: Connection refused) por servicio hasta que
    # `restart: unless-stopped` los reintentaba lo suficiente. Se
    # autocorregía solo en menos de un minuto, pero ensuciaba los logs en
    # cada boot. `healthcheck.sh` viene incluido en la imagen oficial de
    # mariadb.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  websocket:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: atlas-websocket
    command: php bin/websocket-server.php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    ports:
      - "${WEBSOCKET_PORT:-8098}:${WEBSOCKET_PORT:-8098}"
    depends_on:
      db:
        condition: service_healthy

  sync-engine:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: atlas-sync-engine
    command: php bin/sync-engine.php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      websocket:
        condition: service_started
    networks:
      - default
      - forsis-comunicaciones

  monitoring:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: atlas-monitoring
    command: php bin/monitoring-engine.php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      # Carpeta OUT del sistema de timbrado legacy de SICRET — puente
      # temporal de solo lectura, ver App\Monitoring\Timbrado\StampingEvidenceSource.
      # En producción esto se mapea a la carpeta/recurso de red real donde
      # el cliente legacy de SICRET escribe el XML/PDF.
      - ${SICRET_TIMBRADO_OUT_HOST_PATH:-./storage/timbrado-out}:/timbrado-out:ro
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      websocket:
        condition: service_started
    networks:
      - default
      - forsis-comunicaciones

  daily-cutover:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: atlas-daily-cutover
    command: php bin/daily-cutover-engine.php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      websocket:
        condition: service_started

volumes:
  atlas-db-data:

networks:
  forsis-comunicaciones:
    external: true
    name: forsis-comunicaciones
